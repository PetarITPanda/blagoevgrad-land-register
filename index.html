// ── UTILS ──
function fmt(n) { return n.toLocaleString('bg-BG'); }
function fmtEur(n) { return '€ ' + fmt(n); }
function fmtBgn(n) { return fmt(n) + ' лв.'; }

function priceColor(eur) {
  if (eur < 5000)  return '#3ecf8e';
  if (eur < 20000) return '#5b8cff';
  if (eur < 50000) return '#e8b84b';
  return '#f87171';
}

// ── MAP INIT ──
const map = L.map('map', {
  center: [41.99, 23.10],
  zoom: 11,
  zoomControl: true,
  preferCanvas: false,
});

// Dark satellite-style tile layer (Esri World Imagery)
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles © Esri | © Cadastre.bg',
  maxZoom: 19,
}).addTo(map);

// Subtle label overlay
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
  attribution: '',
  maxZoom: 19,
  opacity: 0.6,
}).addTo(map);

// ── STATE ──
const geometryCache = {};   // id -> L.Polygon (or null if not found)
const layerMap = {};        // id -> L.Polygon
let activeId = null;
let filteredIds = new Set(parcels.map(p => p.id));

// ── STATS ──
function updateStats() {
  const visible = parcels.filter(p => filteredIds.has(p.id));
  const totalEur = visible.reduce((s,p) => s+p.eur, 0);
  const totalArea = visible.reduce((s,p) => s+p.area, 0);
  const avg = totalArea > 0 ? Math.round(totalEur / (totalArea/1000)) : 0;
  document.getElementById('countBadge').textContent = visible.length + ' имота';
  document.getElementById('totalEur').textContent = fmt(totalEur);
  document.getElementById('avgSqm').textContent = avg + ' / дка';
}

// ── SIDEBAR ──
function buildSidebar() {
  const list = document.getElementById('parcelList');
  list.innerHTML = '';
  const visible = parcels.filter(p => filteredIds.has(p.id));
  visible.forEach(p => {
    const item = document.createElement('div');
    item.className = 'parcel-item' + (layerMap[p.id] ? '' : ' no-geom');
    item.id = 'item-' + p.id.replace(/\./g, '-');
    const col = priceColor(p.eur);
    item.innerHTML = `
      <div class="pi-dot" style="background:${col}"></div>
      <div class="pi-info">
        <div class="pi-id">${p.id}</div>
        <div class="pi-loc">${p.loc} · ${p.local}</div>
      </div>
      <div>
        <div class="pi-price">${fmtEur(p.eur)}</div>
        <div class="pi-area">${fmt(p.area)} м²</div>
      </div>`;
    item.addEventListener('click', () => selectParcel(p.id, true));
    list.appendChild(item);
  });

  document.getElementById('sidebarHeader').textContent =
    visible.length + ' имота' + (visible.length < parcels.length ? ' (филтрирани)' : '');
}

// ── POPUP ──

  const pdka = Math.round(p.eur / (p.area / 1000));
  return `<div class="popup-inner">
    <div class="popup-id">${p.id}</div>
    <div class="popup-row">
      <span class="popup-label">Местност</span>
      <span class="popup-val">${p.local}</span>

window.openKAIS = function(id) {
  window.open('https://kais.cadastre.bg/bg/Map', '_blank');
  navigator.clipboard?.writeText(id).catch(()=>{});
};

// ── SELECT / HIGHLIGHT ──
function selectParcel(id, flyTo) {
  // Deselect old
  if (activeId && layerMap[activeId]) {
    const p = parcels.find(x => x.id === activeId);
    layerMap[activeId].setStyle(normalStyle(p));
    const oldItem = document.getElementById('item-' + activeId.replace(/\./g, '-'));
    if (oldItem) oldItem.classList.remove('active');
  }
  activeId = id;

  const item = document.getElementById('item-' + id.replace(/\./g, '-'));
  if (item) {
    item.classList.add('active');
    item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  const layer = layerMap[id];
  if (!layer) return;

  const p = parcels.find(x => x.id === id);
  layer.setStyle({ ...normalStyle(p), weight: 3, opacity: 1, fillOpacity: 0.55 });
  layer.bringToFront();

  if (flyTo) {
    map.fitBounds(layer.getBounds(), { maxZoom: 17, padding: [40, 40] });
  }

  layer.openPopup();
}

function normalStyle(p) {
  const col = priceColor(p.eur);
  return {
    color: col,
    weight: 1.5,
    opacity: 0.85,
    fillColor: col,
    fillOpacity: 0.28,
  };
}

// ── GEOMETRY FETCH ──
const INSPIRE_URL = 'https://inspire.cadastre.bg/arcgis/rest/services/Cadastral_Parcel/MapServer/0/query';
const BATCH_SIZE = 20;
let loadedCount = 0;

function buildWhereClause(ids) {
  const quoted = ids.map(id => `'${id}'`).join(',');
  return `nationalcadastralref IN (${quoted})`;
}

async function fetchBatch(ids) {
  const where = buildWhereClause(ids);
  const params = new URLSearchParams({
    where,
    outFields: 'nationalcadastralref',
    returnGeometry: 'true',
    outSR: '4326',
    f: 'geojson',
  });
  const res = await fetch(`${INSPIRE_URL}?${params}`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function addParcelLayer(p, geojsonFeature) {
  // GeoJSON rings are [lng, lat]; Leaflet wants [lat, lng]
  const latlngs = geojsonFeature.geometry.coordinates[0].map(([lng, lat]) => [lat, lng]);
  const layer = L.polygon(latlngs, normalStyle(p));

  layer.bindPopup(makePopup(p), {
    maxWidth: 280,
    className: 'dark-popup',
  });
  layer.on('click', () => selectParcel(p.id, false));
  layer.addTo(map);
  layerMap[p.id] = layer;
}

async function loadAllGeometries() {
  const allIds = parcels.map(p => p.id);
  const batches = [];
  for (let i = 0; i < allIds.length; i += BATCH_SIZE) {
    batches.push(allIds.slice(i, i + BATCH_SIZE));
  }

  const loadFill = document.getElementById('loadFill');
  const loadText = document.getElementById('loadText');

  for (const batch of batches) {
    try {
      const geojson = await fetchBatch(batch);
      if (geojson.features) {
        for (const feat of geojson.features) {
          const ref = feat.properties?.nationalcadastralref;
          if (!ref) continue;
          const p = parcels.find(x => x.id === ref);
          if (!p) continue;
          if (feat.geometry?.type === 'Polygon' || feat.geometry?.type === 'MultiPolygon') {
            addParcelLayer(p, feat.geometry.type === 'MultiPolygon'
              ? { geometry: { coordinates: feat.geometry.coordinates[0] } }
              : feat);
          }
        }
      }
    } catch (e) {
      console.warn('Batch failed:', e);
    }

    loadedCount += batch.length;
    const pct = Math.round(loadedCount / allIds.length * 100);
    loadFill.style.width = pct + '%';
    loadText.textContent = loadedCount + ' / ' + allIds.length;
  }

  // Done
  const geomCount = Object.keys(layerMap).length;
  document.getElementById('loadStatus').style.display = 'none';
  document.getElementById('sidebarHeader').textContent =
    geomCount + ' геометрии заредени · ' + (parcels.length - geomCount) + ' без данни';

  buildSidebar();

  // Fit to all loaded parcels
  const allLayers = Object.values(layerMap);
  if (allLayers.length > 0) {
    const group = L.featureGroup(allLayers);
    map.fitBounds(group.getBounds(), { padding: [20, 20] });
  }
}

// ── FILTERS ──
const muncs = [...new Set(parcels.map(p => p.loc))].sort();
const muncSel = document.getElementById('muncFilter');
muncs.forEach(m => {
  const o = document.createElement('option');
  o.value = m; o.textContent = m;
  muncSel.appendChild(o);
});

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const t = document.getElementById('typeFilter').value.toLowerCase();
  const m = document.getElementById('muncFilter').value;
  const pr = document.getElementById('priceFilter').value;

  filteredIds = new Set();
  parcels.forEach(p => {
    const matchQ = !q || p.id.toLowerCase().includes(q) ||
      p.loc.toLowerCase().includes(q) || p.local.toLowerCase().includes(q) ||
      p.type.toLowerCase().includes(q);
    const matchT = !t || p.type.toLowerCase().includes(t);
    const matchM = !m || p.loc === m;
    let matchP = true;
    if (pr) {
      const [lo, hi] = pr.split('-').map(Number);
      matchP = hi ? (p.eur >= lo && p.eur < hi) : (p.eur >= lo);
    }
    if (matchQ && matchT && matchM && matchP) filteredIds.add(p.id);
  });

  // Show/hide map layers
  parcels.forEach(p => {
    const layer = layerMap[p.id];
    if (!layer) return;
    if (filteredIds.has(p.id)) {
      if (!map.hasLayer(layer)) layer.addTo(map);
    } else {
      if (map.hasLayer(layer)) layer.remove();
    }
  });

  updateStats();
  buildSidebar();
}

['search', 'typeFilter', 'muncFilter', 'priceFilter'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'change', applyFilters);
});

// ── USER INFO (Azure Static Web Apps /.auth/me) ──
fetch('/.auth/me').then(r => r.json()).then(data => {
  const user = data?.clientPrincipal;
  if (!user) return;
  const name = user.userDetails || user.userId || '';
  document.getElementById('userName').textContent = name;
}).catch(() => {});

// ── INIT ──
updateStats();
buildSidebar();
loadAllGeometries();
</script>
